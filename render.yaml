services:
  - type: web
    name: jobapply
    runtime: python
    buildCommand: "bash backend/render_build.sh"
    startCommand: "bash backend/render_start.sh"
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: jobapply
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESUME_STORAGE_PATH
        value: /data/uploads/resumes
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /data/playwright
    disk:
      name: data
      mountPath: /data
      sizeGB: 1